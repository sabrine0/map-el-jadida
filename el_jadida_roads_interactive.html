
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Jadida – Entry/Exit Roads & Carrefours</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg:#0b0c10;
      --card:#111319;
      --text:#e9eef5;
      --muted:#a9b3c3;
      --accent:#ff7a18;
      --chip:#1b1f2a;
      --btn:#1d2433;
      --btn-hover:#262f42;
      --green:#00b37e;
      --red:#ff3b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 600px at 20% -50%, #162033 0, transparent 70%),
                  radial-gradient(900px 500px at 120% -30%, #182235 0, transparent 65%),
                  var(--bg);
      color: var(--text);
    }
    header {
      padding: 28px 24px 8px 24px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-weight: 800;
      letter-spacing: .2px;
    }
    .sub {
      margin: 0 0 12px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
      padding: 16px 24px 40px 24px;
    }
    .card {
      background: linear-gradient(180deg, #121625, #0f1420);
      border: 1px solid #1f2a3a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    .card header {
      padding: 14px 16px 10px 16px;
      border-bottom: 1px solid #1f2a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card h2 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chip {
      display: inline-block;
      padding: 4px 10px;
      background: var(--chip);
      border: 1px solid #26344a;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }
    .map {
      height: 280px;
      width: 100%;
    }
    .card .content {
      padding: 12px 14px 16px 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .stops {
      display: grid;
      gap: 6px;
    }
    .stop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px dashed #243249;
      border-radius: 10px;
      background: #0e1320;
    }
    .stop .name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .dot {
      height: 10px; width: 10px;
      background: #000;
      border: 2px solid #fffb;
      outline: 2px solid #222b;
      border-radius: 999px;
      box-shadow: 0 0 0 2px #fffb, 0 0 0 4px #0008;
    }
    .row-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .btn {
      background: var(--btn);
      border: 1px solid #2a3448;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .btn:hover { background: var(--btn-hover); }
    .legend {
      color: var(--muted);
      font-size: 12px;
    }
    .tag {
      padding: 2px 8px; border-radius: 999px;
      background: #152036; border: 1px solid #293550; color: #cfe1ff; font-size: 11px;
    }
    footer { color: var(--muted); font-size: 12px; padding: 0 24px 24px; }
  </style>
</head>
<body>
  <header>
    <h1>El Jadida – Entry/Exit Roads & Carrefours</h1>
    <p class="sub">Click any red marker on a map to see the exact carrefour name. Use the “Open in Google Maps” buttons to view them on Google Maps.</p>
  </header>

  <div id="cards" class="grid"></div>

  <footer>Coordinates are approximate for planning and visualization.</footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    // Data for roads and carrefours (approximate coordinates)
    const roads = [
      {
        id: "a1",
        name: "Autoroute A1",
        type: "Highway",
        google: "https://www.google.com/maps/search/?api=1&query=Autoroute+A1+El+Jadida",
        polyline: [
          [33.270, -8.570],
          [33.255, -8.552],
          [33.235, -8.530],
          [33.210, -8.515]
        ],
        carrefours: [
          { name: "Carrefour A1 × A103", coords: [33.2555, -8.5520] },
          { name: "Carrefour vers N1 Nord", coords: [33.2450, -8.5350] }
        ]
      },
      {
        id: "a103",
        name: "A103 – Pénétrante d’El Jadida",
        type: "Expressway",
        google: "https://www.google.com/maps/search/?api=1&query=A103+El+Jadida",
        polyline: [
          [33.2555, -8.5520],
          [33.2470, -8.5180],
          [33.2395, -8.5115]
        ],
        carrefours: [
          { name: "Carrefour A1 × A103", coords: [33.2555, -8.5520] },
          { name: "Carrefour Mazagan Mall (A103 × N1 × R320)", coords: [33.2470, -8.5180] },
          { name: "Carrefour Power Gym (A103 × Moulay Abdelkader)", coords: [33.2395, -8.5115] }
        ]
      },
      {
        id: "n1",
        name: "Route Nationale N1",
        type: "National",
        google: "https://www.google.com/maps/search/?api=1&query=N1+El+Jadida",
        polyline: [
          [33.2550, -8.4900],
          [33.2420, -8.4980],
          [33.2300, -8.5050],
          [33.2150, -8.5080]
        ],
        carrefours: [
          { name: "Carrefour Sidi Moussa", coords: [33.2340, -8.5100] },
          { name: "Carrefour Hay Ryad (N1 × Ahmed Chaouki)", coords: [33.2300, -8.5050] },
          { name: "Carrefour Hay Al Qods", coords: [33.2250, -8.5005] }
        ]
      },
      {
        id: "r301",
        name: "Route Régionale R301 (Côtière)",
        type: "Regional",
        google: "https://www.google.com/maps/search/?api=1&query=R301+El+Jadida",
        polyline: [
          [33.2650, -8.5150],
          [33.2552, -8.5028],
          [33.2410, -8.5060],
          [33.2250, -8.5200]
        ],
        carrefours: [
          { name: "Carrefour Corniche × Mohamed VI", coords: [33.2552, -8.5028] },
          { name: "Carrefour Plage d’El Jadida", coords: [33.2510, -8.5000] }
        ]
      },
      {
        id: "r320",
        name: "Route R320",
        type: "Regional",
        google: "https://www.google.com/maps/search/?api=1&query=R320+El+Jadida",
        polyline: [
          [33.2320, -8.4890],
          [33.2385, -8.5010],
          [33.2470, -8.5180]
        ],
        carrefours: [
          { name: "Carrefour Dehlya Corner (R320 × Annasr)", coords: [33.2385, -8.5010] },
          { name: "Carrefour Mazagan Mall (R320 × A103 × N1)", coords: [33.2470, -8.5180] }
        ]
      },
      {
        id: "marrakech",
        name: "Route de Marrakech (branche N1 sud)",
        type: "National",
        google: "https://www.google.com/maps/search/?api=1&query=Route+de+Marrakech+El+Jadida",
        polyline: [
          [33.2250, -8.5005],
          [33.2050, -8.4850],
          [33.1850, -8.4700]
        ],
        carrefours: [
          { name: "Carrefour Hay Al Qods × N1", coords: [33.2250, -8.5005] }
        ]
      },
      {
        id: "azemmour",
        name: "Route d’Azemmour (branche N1 nord)",
        type: "National",
        google: "https://www.google.com/maps/search/?api=1&query=Route+d%27Azemmour+El+Jadida",
        polyline: [
          [33.2300, -8.5050],
          [33.2420, -8.4980],
          [33.2550, -8.4900]
        ],
        carrefours: [
          { name: "Carrefour Sidi Moussa", coords: [33.2340, -8.5100] },
          { name: "Junction toward A1", coords: [33.2650, -8.5500] }
        ]
      },
      {
        id: "oualidia",
        name: "Route d’Oualidia (branche R301 sud)",
        type: "Regional",
        google: "https://www.google.com/maps/search/?api=1&query=Route+d%27Oualidia+El+Jadida",
        polyline: [
          [33.2410, -8.5060],
          [33.2320, -8.5150],
          [33.2200, -8.5350]
        ],
        carrefours: [
          { name: "Carrefour Corniche × Mohamed VI", coords: [33.2552, -8.5028] }
        ]
      }
    ];

    const cards = document.getElementById("cards");

    function googleLatLonLink(lat, lon, label="") {
      const q = encodeURIComponent(`${lat},${lon}${label ? " ("+label+")" : ""}`);
      return `https://www.google.com/maps/search/?api=1&query=${q}`;
    }

    // Build UI
    roads.forEach((road) => {
      const card = document.createElement("section");
      card.className = "card";

      card.innerHTML = `
        <header>
          <h2>🛣️ ${road.name}</h2>
          <span class="chip">${road.type}</span>
        </header>
        <div id="map_${road.id}" class="map"></div>
        <div class="content">
          <div class="row-actions">
            <a class="btn" href="${road.google}" target="_blank" rel="noopener">Open road in Google Maps</a>
            <span class="legend">Click markers to see carrefour names</span>
          </div>
          <div class="stops" id="stops_${road.id}"></div>
        </div>
      `;
      cards.appendChild(card);

      const map = L.map(`map_${road.id}`, { zoomControl: false }).setView([33.2316, -8.5007], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Draw polyline for the road
      const line = L.polyline(road.polyline, {
        color: "#ff7a18",
        weight: 6,
        opacity: 0.95
      }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [20, 20] });

      // Add carrefour markers
      const stopsWrap = document.getElementById(`stops_${road.id}`);
      road.carrefours.forEach((c, idx) => {
        const marker = L.circleMarker(c.coords, {
          radius: 7,
          color: "#111",
          fillColor: "#ff3b3b",
          weight: 2,
          fillOpacity: 0.95
        }).addTo(map);
        marker.bindPopup(`<b>${c.name}</b><br/><small>${c.coords[0].toFixed(5)}, ${c.coords[1].toFixed(5)}</small>`);

        const stopRow = document.createElement("div");
        stopRow.className = "stop";
        stopRow.innerHTML = `
          <div class="name">
            <span class="dot"></span>
            <span>${idx+1}. ${c.name}</span>
          </div>
          <div class="row-actions">
            <a class="btn" href="${googleLatLonLink(c.coords[0], c.coords[1], c.name)}" target="_blank" rel="noopener">See in Google Maps</a>
          </div>
        `;
        stopsWrap.appendChild(stopRow);
      });
    });
  </script>
</body>
</html>
